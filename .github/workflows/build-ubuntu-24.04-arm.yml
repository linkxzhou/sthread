name: ubuntu-24.04-arm

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ubuntu-24.04-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      os: ubuntu-24.04-arm
      compilers: '["g++","clang++"]'
