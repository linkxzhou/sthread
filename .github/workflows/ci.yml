name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 多平台编译矩阵：stlib、libmthread、apps、tests 全部编过才算通过。
  # 运行测试单独成步：stlib/tests 为阻塞项；tests/ 下的 unittest 先作为
  # 非阻塞信息项（Linux 上 st_context 等已知问题见 plan/09）。
  build:
    name: build (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - { os: ubuntu-22.04,     cxx: g++,     experimental: false }
          - { os: ubuntu-22.04,     cxx: clang++, experimental: false }
          - { os: ubuntu-24.04,     cxx: g++,     experimental: false }
          - { os: ubuntu-24.04,     cxx: clang++, experimental: false }
          # Linux aarch64
          - { os: ubuntu-24.04-arm, cxx: g++,     experimental: false }
          - { os: ubuntu-24.04-arm, cxx: clang++, experimental: false }
          # macOS（Apple Clang；g++ 在 macOS 上就是 clang++）
          - { os: macos-14,         cxx: clang++, experimental: false } # arm64
          - { os: macos-15,         cxx: clang++, experimental: false } # arm64
          - { os: macos-15-intel,   cxx: clang++, experimental: false } # x86_64
          - { os: macos-26,         cxx: clang++, experimental: true }  # arm64
    env:
      TRACE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          uname -a
          ${{ matrix.cxx }} --version
          make --version | head -1

      - name: make stlib
        run: make stlib CC=${{ matrix.cxx }}

      - name: make lib
        run: make lib CC=${{ matrix.cxx }}

      - name: make apps
        run: make apps CC=${{ matrix.cxx }}

      - name: make tests (build only)
        run: make tests CC=${{ matrix.cxx }}

      - name: make stlib-tests (build only)
        run: make stlib-tests CC=${{ matrix.cxx }}

      - name: run stlib/tests
        timeout-minutes: 5
        run: make -C stlib/tests run CC=${{ matrix.cxx }}

      - name: "[非阻塞] run tests/"
        continue-on-error: true
        timeout-minutes: 10
        run: make -C tests run CC=${{ matrix.cxx }}

      - name: clean tree
        if: always()
        run: |
          make clean
          git status --porcelain --ignored | tee /tmp/residue
          test ! -s /tmp/residue || { echo "make clean 后仍有残留"; exit 1; }

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: make format-check
        run: make format-check CLANG_FORMAT=clang-format-18
