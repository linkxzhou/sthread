name: android

# 交叉编译，不在宿主机上跑测试（二进制是 Android ELF）。
# 不复用 _build.yml：那份 workflow 会执行 make -C stlib/tests run。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      # 只交叉编译、不跑测试。用默认 TRACE=1，让 LOG_TRACE 实参进入类型检查。
      TRACE: "1"
      ABI: ${{ matrix.abi }}
      API: "21"
    steps:
      - uses: actions/checkout@v4

      - name: ndk
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          test -n "${ANDROID_NDK_HOME:-}"
          if [ -f "$ANDROID_NDK_HOME/source.properties" ]; then
            cat "$ANDROID_NDK_HOME/source.properties"
          fi

      - name: make android
        run: make android ABI="$ABI" API="$API"

      - name: check binaries
        run: |
          set -euo pipefail
          bin=$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin)
          readelf="$bin/llvm-readelf"
          nm="$bin/llvm-nm"
          if [ "$ABI" = arm64-v8a ]; then
            arch_re='ARM aarch64'
          else
            arch_re='x86-64'
          fi
          file libmthread.so app/st_httpclient/st_httpclient app/st_httpserver/main
          # grep -q 会在第一次命中后关管道。llvm-nm 写失败退出 74，
          # pipefail 会把整步打红。先落盘，再 grep 文件（读完再退出）。
          file libmthread.so > /tmp/file-so.txt
          file app/st_httpclient/st_httpclient > /tmp/file-http.txt
          grep "$arch_re" /tmp/file-so.txt >/dev/null
          grep "$arch_re" /tmp/file-http.txt >/dev/null
          "$nm" libmthread.a > /tmp/libmthread.nm
          grep ' setmcontext$' /tmp/libmthread.nm >/dev/null
          grep ' getmcontext$' /tmp/libmthread.nm >/dev/null
          if grep ' _setmcontext$' /tmp/libmthread.nm >/dev/null; then
            echo "unexpected Mach-O symbol _setmcontext"
            exit 1
          fi
          check_needed() {
            local path="$1"
            echo "== NEEDED $path"
            "$readelf" -d "$path" | awk '/NEEDED/ {print}'
            local sos
            sos=$("$readelf" -d "$path" | awk -F'[][]' '/NEEDED/ {print $2}')
            local so
            for so in $sos; do
              case "$so" in
                libc.so|libm.so|libdl.so|liblog.so) ;;
                *) echo "unexpected NEEDED $so in $path"; exit 1 ;;
              esac
            done
          }
          check_needed libmthread.so
          check_needed stlib/libst.so
          check_needed app/st_httpclient/st_httpclient
          check_needed app/st_httpserver/main
          check_needed app/st_dns/main
          for b in tests/*_unittest stlib/tests/*_test; do
            if [ -f "$b" ]; then
              file "$b" > /tmp/file-bin.txt
              if grep ELF /tmp/file-bin.txt >/dev/null; then
                grep "$arch_re" /tmp/file-bin.txt >/dev/null
                check_needed "$b"
              fi
            fi
          done

      - name: clean tree
        if: always()
        run: |
          make clean
          git status --porcelain --ignored | tee /tmp/residue
          test ! -s /tmp/residue || { echo "make clean 后仍有残留"; exit 1; }
